name: remove legacy GitHub Releases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove:
    if: github.repository == 'EnchiladaBoy/Youtube-in-the-terminal'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Release objects while preserving Git tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].id' |
          while IFS= read -r release_id; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done
