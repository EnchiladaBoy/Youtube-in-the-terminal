name: source tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an in-progress run for the same ref when a newer commit arrives.
concurrency:
  group: source-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            label: linux / Python 3.10
          - os: ubuntu-latest
            python: "3.12"
            label: linux / Python 3.12
          - os: macos-14
            python: "3.12"
            label: macOS arm64 / Python 3.12
          - os: windows-latest
            python: "3.12"
            label: Windows / Python 3.12

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install source dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Test source and installer
        run: python tests/ci_runner.py

      - name: Smoke test source entry point
        run: python yt-ascii --self-test

      - name: Test streamed bootstrap (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python - --source-dir . --no-modify-path < install.py

      - name: Test streamed bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Content -Raw install.py | py -3 - --source-dir . --no-modify-path

      - name: Test installed launcher (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="$(python -c "import runpy; print(runpy.run_path('yt-ascii', run_name='version_check')['APP_VERSION'])")"
          test "$(~/.local/bin/yt-ascii --version)" = "yt-ascii ${version} (source)"

      - name: Test installed launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = & "$env:LOCALAPPDATA\Programs\yt-ascii\bin\yt-ascii.cmd" --version
          $version = python -c "import runpy; print(runpy.run_path('yt-ascii', run_name='version_check')['APP_VERSION'])"
          $expected = "yt-ascii $version (source)"
          if ($actual -ne $expected) {
            throw "unexpected version output: $actual"
          }

      - name: Test uninstaller
        run: python install.py --uninstall

      - name: Validate stable tag
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python -c "import os, runpy;
          expected = 'v' + runpy.run_path('yt-ascii', run_name='tag_check')['APP_VERSION'];
          actual = os.environ['GITHUB_REF_NAME'];
          assert actual == expected, f'tag {actual} != application version {expected}'"

      - name: Test tagged archive bootstrap
        if: >-
          startsWith(github.ref, 'refs/tags/') &&
          matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          python install.py --version "${{ github.ref_name }}" --no-modify-path
          version="$(python -c "import runpy; print(runpy.run_path('yt-ascii', run_name='version_check')['APP_VERSION'])")"
          test "$(~/.local/bin/yt-ascii --version)" = "yt-ascii ${version} (${{ github.ref_name }})"
          python install.py --uninstall
